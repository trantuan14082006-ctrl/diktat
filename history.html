<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{if(localStorage.getItem('diktatTheme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<title>Lịch sử bài làm – Diktat Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M6 20A14 14 0 0 1 20 6H44A14 14 0 0 1 58 20V54A4 4 0 0 1 54 58H10A4 4 0 0 1 6 54Z' fill='none' stroke='%23f5b301' stroke-width='8' stroke-linejoin='round'/%3E%3Cpath d='M23 21H31A11 11 0 0 1 31 43H23Z' fill='none' stroke='%23f5b301' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--g:#f3f4f2;--gr:#e5a800;--tx:#14181f;--mu:#5b6470;--bd:#d5d9d4;--sel:#fff1bf;--bad:#c0341d;--sh:0 2px 10px rgba(0,0,0,.1);--yl:#f5b301;--yl2:#fff6d6;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

/* Header (giống trang Hören) */
.hd{max-width:1480px;margin:0 auto;padding:12px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--yl);font-weight:700;font-size:22px;text-decoration:none}
.logo b{width:40px;height:40px;border-radius:12px 12px 4px 4px;border:4px solid var(--yl);display:grid;place-items:center;font-size:20px;transition:transform .2s}
.logo:hover b{transform:rotate(-6deg) scale(1.06)}
nav{display:flex;align-items:center;gap:8px}
nav a{padding:7px 14px;border:2px solid transparent;border-radius:8px;cursor:pointer;color:var(--tx);text-decoration:none;transition:border-color .25s,background-color .25s,transform .15s}
nav a:hover{border-color:rgba(245,179,1,.45)}nav a:active{transform:scale(.96)}
nav a.act{border-color:var(--yl);background:var(--yl2);color:var(--tx);font-weight:600}
.tg{width:42px;height:42px;border-radius:50%;border:2px solid var(--bd);background:var(--g);color:var(--tx);font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;margin-left:6px;transition:border-color .2s,background-color .2s,transform .2s}
.tg:hover{border-color:var(--yl);transform:rotate(-12deg) scale(1.06)}.tg:active{transform:scale(.92)}

/* Main */
main{max-width:1480px;margin:0 auto;padding:10px 48px 70px}
.th{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:18px 0 26px}
h1{margin:0;font-size:clamp(24px,3.2vw,38px);line-height:1.2;border-left:5px solid var(--gr);padding-left:20px}
h3{font-size:22px;margin:0 0 18px}
.srch{width:min(500px,100%);border:1px solid var(--bd);border-radius:12px;padding:13px 16px;background:var(--bg);color:var(--tx);font:16px inherit}
.col{max-width:690px}.col.w2{max-width:760px}
.mu{color:var(--mu);font-size:14px}.hide{display:none!important}

/* Danh sách đề (accordion + pill, giống danh sách bài Hören) */
.acc{margin-bottom:18px}
.ah{background:var(--g);border-radius:18px;padding:22px 30px;font-size:24px;display:flex;justify-content:space-between;cursor:pointer;border:1px solid transparent}
.acc.open .ah{border-color:var(--gr)}.ah span{transition:transform .35s cubic-bezier(.2,.7,.2,1)}.acc.open .ah span{transform:rotate(180deg)}
.nm{flex:1;font-style:normal}
.abw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.2,.7,.2,1)}.acc.open .abw{grid-template-rows:1fr}
.ab{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .38s}.acc.open .ab{visibility:visible;transition-delay:0s}
.abi{display:flex;flex-direction:column;gap:12px;padding:14px 6px 2px 0}
.pill{background:var(--g);border-radius:16px;padding:16px 30px;cursor:pointer;border:1px solid transparent;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill small{display:block;color:var(--mu);font-size:12px}
.pill:hover{border-color:var(--gr)}
.ah,.pill,.btn,.sm,.sbtn{transition:border-color .2s,background-color .2s,transform .2s,box-shadow .2s}
.ah:hover,.pill:hover{transform:translateX(4px);box-shadow:0 4px 14px rgba(0,0,0,.07)}
.ah:active,.pill:active,.btn:active,.sm:active,.sbtn:active{transform:scale(.97)}
.pts{display:inline-block;background:var(--yl);color:#14181f;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}

/* Card (đề bài, API key) */
.card{background:var(--g);border-radius:18px;padding:22px;max-width:760px;margin-bottom:16px}
.card h3{margin:0 0 14px;font-size:20px}
.card input[type=text],.card input[type=password]{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:16px inherit}

/* Ô gõ bài (giống ô gõ Hören) */
.box{border:1px solid var(--bd);border-radius:16px;margin-top:16px;background:var(--bg);transition:border-color .2s}
.box:focus-within{border-color:var(--gr)}
.box textarea{display:block;width:100%;min-height:240px;margin:0;border:0;padding:18px;border-radius:16px;font-family:inherit;font-size:17px;line-height:1.6;letter-spacing:.3px;background:transparent;color:var(--tx);resize:vertical;outline:0}
.box textarea::placeholder{color:var(--mu)}
.cnt{text-align:right;margin:14px 0}
.cnt b{color:var(--tx)}

/* Nút */
.btns{display:flex;justify-content:space-between;gap:20px}
.btn{border:0;border-radius:12px;padding:17px 0;font:600 16px system-ui,sans-serif;cursor:pointer;width:42%}
.b1{background:var(--g);color:var(--tx)}.b2{background:var(--gr);color:var(--tx)}
.btn:hover,.sbtn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.sm{background:var(--g);border:0;border-radius:8px;padding:6px 14px;font:italic 15px system-ui,sans-serif;color:var(--tx);cursor:pointer;margin:0 8px 8px 0}
.tools{margin-top:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.sbtn{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 14px;font:600 14px system-ui;cursor:pointer;color:var(--tx)}
.sm,.b1,.sbtn,.btn{color:#14181f!important}

/* Kết quả */
.result{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:22px 24px;margin-top:20px;display:none}
.result.on{display:block}
.result h3{margin:0 0 16px}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.score-item{background:var(--g);border-radius:12px;padding:14px 18px}
.score-item .label{font-size:13px;color:var(--mu);margin-bottom:4px}
.score-item .val{font-size:28px;font-weight:700;color:var(--gr)}
.score-item .val.vs{font-size:22px}
.score-item .max{font-size:14px;color:var(--mu);font-weight:400}
.feedback{margin-top:16px;line-height:1.7;white-space:pre-wrap}
.feedback h4{margin:18px 0 8px;color:var(--tx)}
.corrections{background:var(--g);border-radius:12px;padding:16px 20px;margin-top:14px;font-size:15px;line-height:1.7;white-space:pre-wrap}

/* Loading */
.loading{display:none;align-items:center;gap:12px;margin-top:16px;color:var(--mu)}
.loading.on{display:flex}
.spin{width:24px;height:24px;border:3px solid var(--bd);border-top-color:var(--yl);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* API key */
.key-bar{display:flex;gap:8px;align-items:center}
.key-bar input{flex:1}
.key-bar .btn{padding:11px 22px;width:auto;flex:none}
.key-ok{color:#158f4a;font-size:14px;margin-top:4px}

/* Toast */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#14181f;color:#fff;padding:12px 22px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:400}
#toast.on{opacity:1;transform:translateX(-50%)}
:focus-visible{outline:2px solid var(--gr);outline-offset:2px;border-radius:8px}

/* Avatar thành viên + menu (giống index) */
.fb-bar{display:flex;align-items:center;gap:6px;margin-left:8px}
.um{position:relative}
.um-av{width:40px;height:40px;border-radius:50%;border:0;background:var(--yl);color:#14181f;font:700 15px system-ui,sans-serif;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .15s,box-shadow .2s}
.um-av:hover{transform:scale(1.06)}.um-av:focus-visible{outline:3px solid var(--yl2)}
.um-pop{position:absolute;right:0;top:calc(100% + 12px);min-width:300px;max-width:92vw;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.2);padding:6px 0;z-index:300}
.um-n{padding:14px 20px 6px;font-weight:700;font-size:16px;overflow-wrap:anywhere}
.um-s{white-space:nowrap;padding:6px 20px 14px;color:var(--mu);font-size:13px;border-bottom:1px dashed var(--bd)}
.um-o{display:block;width:100%;text-align:left;padding:13px 20px;border:0;background:none;color:var(--tx);font:16px system-ui,sans-serif;cursor:pointer}
.um-o:hover{background:var(--g)}
a.um-o{text-decoration:none;box-sizing:border-box}
@media(max-width:700px){.fb-bar{margin-left:0}}

/* Màn hình tải: chữ D xoay (giống trang chính) */
#fbLoad{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;background:var(--bg)}
#fbLoad.on{display:flex}
#fbLoad b{display:grid;place-items:center;box-sizing:border-box;width:88px;height:88px;border-radius:26px 26px 9px 9px;border:9px solid var(--yl);color:var(--yl);font:700 44px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;animation:lspin 1.1s cubic-bezier(.65,0,.35,1) infinite}
@keyframes lspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#fbLoad b{animation:none}}

#topbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--yl);box-shadow:0 0 10px var(--yl);z-index:100001;opacity:0;pointer-events:none;transition:width .25s ease,opacity .3s ease}

/* Dark mode */
:root[data-theme=dark]{color-scheme:dark;
--bg:#16181d;--g:#22262d;--gr:#d4a017;--tx:#e8eaee;--mu:#98a1ad;--bd:#383e48;--sel:#4a3d12;--bad:#ff8272;--sh:0 2px 12px rgba(0,0,0,.55);--yl:#e0ac1a;--yl2:#3a3110}
:root[data-theme=dark] .sm,:root[data-theme=dark] .b1,:root[data-theme=dark] .sbtn,:root[data-theme=dark] .btn{color:var(--tx)!important}
:root[data-theme=dark] .b2,:root[data-theme=dark] .pts{color:#14181f!important}

/* Responsive */
@media(max-width:700px){main{padding:6px 16px 60px}.hd{padding:10px 16px}.ah{padding:16px 20px;font-size:20px}.btn{width:46%}.score-grid{grid-template-columns:1fr}.result{padding:18px 16px}}

/* Animation */
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.vin{animation:vin .35s cubic-bezier(.2,.7,.2,1) both}
@media(prefers-reduced-motion:reduce){.vin{animation:none}*{transition:none!important;scroll-behavior:auto!important}}

/* Lịch sử bài làm */
.hsk{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}
.hsk button{border:1px solid var(--bd);background:var(--g);color:var(--tx);border-radius:999px;padding:12px 26px;font:600 16px system-ui,sans-serif;cursor:pointer;transition:border-color .2s,background-color .2s,transform .15s}
.hsk button:hover{border-color:var(--yl)}.hsk button:active{transform:scale(.96)}
.hsk button.on{border:2px solid var(--yl);background:var(--yl2);padding:11px 25px}
.hh .ah{font-size:17px;padding:16px 22px;gap:14px;align-items:center}
.hh .nm{display:flex;flex-direction:column;min-width:0}
.hh .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hh .nm small{color:var(--mu);font-size:13px}
.hh .sc{font-weight:700;color:var(--gr);white-space:nowrap}
.acc.open.hh .ah span{transform:none}.acc.open.hh .ah span.ch{transform:rotate(180deg)}
.hb{padding:14px 4px 6px 0}
.hmeta{color:var(--mu);font-size:14px;margin-bottom:10px}
.hb .corrections{margin-top:12px}
.hb .score-grid{margin:14px 0}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" crossorigin="anonymous"></script>

<body>
<div id="fbLoad" class="on" role="status" aria-label="Đang tải"><b>D</b></div>
<div id="topbar"></div>
<div id="toast"></div>

<header class="hd">
  <a class="logo" href="index.html"><b>D</b>Diktat Dashboard</a>
  <nav>
    <a href="index.html" class="act">Deutschkurs</a>
    <button type="button" class="tg" id="themeBtn" aria-label="Đổi giao diện sáng/tối">🌙</button>
    <div class="fb-bar"><div class="um"><button type="button" class="um-av hide" id="fbAuth" aria-haspopup="true" aria-expanded="false"></button><div class="um-pop hide" id="umPop" role="menu"><div class="um-n" id="umName"></div><div class="um-s" id="umSess"></div><a class="um-o" id="umHist" href="history.html" role="menuitem">📋 Lịch sử bài làm</a><button type="button" class="um-o" id="umOut" role="menuitem">Đăng xuất</button></div></div></div>
  </nav>
</header>

<main>
  <div class="th"><h1>Lịch sử bài làm</h1></div>
  <div class="hsk" id="hTab" role="tablist">
    <button type="button" class="on" data-s="write" role="tab" aria-selected="true">Schreiben</button>
    <button type="button" data-s="speak" role="tab" aria-selected="false">Sprechen</button>
  </div>

  <div class="col w2" id="hWrite"></div>
  <div class="col w2 hide" id="hSpeak"><div class="card" style="max-width:none">🎤 <b>Intensives Sprechen</b> – sắp ra mắt. Khi có bài Sprechen, lịch sử bài nói sẽ hiện ở đây.</div></div>
</main>
<script>
const $=id=>document.getElementById(id);

/* ===== Theme ===== */
const themeBtn=$('themeBtn');
function setTheme(t){document.documentElement.dataset.theme=t;themeBtn.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('diktatTheme',t)}catch(e){}}
themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
themeBtn.textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';

/* ===== Toast ===== */
let toastT;function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2500)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let fbUser=null;

/* ===== Thanh vàng chạy trên cùng khi chuyển mục (giống YouTube) ===== */
var TopBar=(function(){const el=document.getElementById('topbar');let t1=0,t2=0,w=0;
  const busy=()=>{const l=document.getElementById('fbLoad');return !!(l&&l.classList.contains('on'))};
  function start(){if(!el)return;clearTimeout(t2);clearInterval(t1);el.style.transition='none';el.style.width='0';el.style.opacity='1';void el.offsetWidth;
    el.style.transition='width .25s ease,opacity .3s ease';w=14;el.style.width=w+'%';t1=setInterval(()=>{w+=(92-w)*.12;el.style.width=w+'%'},180)}
  function done(){if(!el)return;clearInterval(t1);el.style.width='100%';t2=setTimeout(()=>{el.style.opacity='0';t2=setTimeout(()=>{el.style.transition='none';el.style.width='0'},320)},200)}
  function pulse(){if(busy())return;start();setTimeout(done,380)}
  return{start,done,pulse}})();
/* bấm link sang trang khác => thanh chạy tới khi trang mới tải xong */
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');
  if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target==='_blank'||a.hasAttribute('download'))return;
  let u;try{u=new URL(a.href,location.href)}catch(er){return}
  if(u.origin===location.origin&&u.pathname!==location.pathname)TopBar.start()});
window.addEventListener('pageshow',e=>{if(e.persisted)TopBar.done()});

/* màn hình chữ D: ẩn khi đã biết trạng thái đăng nhập (tối đa 10 giây) */
function hideLoad(){const l=document.getElementById('fbLoad');if(l)l.classList.remove('on')}
setTimeout(hideLoad,10000);
window.addEventListener('pageshow',e=>{if(e.persisted)hideLoad()});


/* ===== Đăng nhập dùng chung với trang chính (cùng tài khoản Firebase) ===== */
const FB_CFG={apiKey:"AIzaSyAgLQfNm10c-iAiQ942r-X3X9aPA4sfdhk",authDomain:"diktat-dashboard.firebaseapp.com",projectId:"diktat-dashboard",storageBucket:"diktat-dashboard.firebasestorage.app",messagingSenderId:"579828825281",appId:"1:579828825281:web:6e764c41808673a7642840"};
const FB_DOM='@diktat.web',LIB_UID="56DjTRmzRjTaduizB4mhv5bcDC72",SESS_MS=24*3600*1000;
let fbMemName='',umTimer=0;
const fbShownName=()=>fbMemName||(fbUser&&fbUser.displayName)||((fbUser&&fbUser.email)||'').replace(FB_DOM,'');
function fbInitials(n){n=(n||'').trim();if(!n)return'?';const w=n.split(/\s+/);return(w.length>1?w[0][0]+w[w.length-1][0]:n.slice(0,2)).toUpperCase()}
function umLeft(){
  if(!fbUser||!fbUser.metadata)return'';const t=Date.parse(fbUser.metadata.lastSignInTime);if(!t)return'';
  const ms=t+SESS_MS-Date.now();if(ms<=0)return'Session expired';
  const h=Math.floor(ms/3.6e6),m=Math.floor(ms%3.6e6/6e4),sc=Math.floor(ms%6e4/1e3),p=n=>String(n).padStart(2,'0');
  return'Thời gian phiên còn lại: '+h+'h '+p(m)+'m '+p(sc)+'s'}
function umOpen(on){
  const pop=$('umPop');pop.classList.toggle('hide',!on);$('fbAuth').setAttribute('aria-expanded',on?'true':'false');clearInterval(umTimer);
  if(on){$('umName').textContent=fbShownName();const tick=()=>{$('umSess').textContent=umLeft()};tick();umTimer=setInterval(tick,1000)}}
document.addEventListener('click',e=>{if(!e.target.closest('.um'))umOpen(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')umOpen(false)});
$('umOut').onclick=()=>{umOpen(false);firebase.auth().signOut()};
function toLogin(note){try{if(note)localStorage.setItem('gateNote',note)}catch(e){}location.replace('index.html')}
function sessExpired(){const t=fbUser&&fbUser.metadata?Date.parse(fbUser.metadata.lastSignInTime):0;return !!t&&Date.now()-t>SESS_MS}
function fbAvatar(){const b=$('fbAuth');b.classList.remove('hide');b.textContent=fbInitials(fbShownName());b.title=fbShownName();b.onclick=e=>{e.stopPropagation();umOpen($('umPop').classList.contains('hide'))}}
if(typeof firebase!=='undefined'){
  try{
    if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
    firebase.auth().onAuthStateChanged(async u=>{
      if(!u){toLogin();return}                                   /* chưa đăng nhập => về trang chính để đăng nhập */
      fbUser=u;
      if(sessExpired()){firebase.auth().signOut();toLogin('Phiên đăng nhập đã hết hạn (24 giờ). Vui lòng đăng nhập lại.');return}
      fbAvatar();                                                /* hiện avatar ngay, tên đầy đủ cập nhật sau */
      hideLoad();
      onUser();
      if(u.uid!==LIB_UID){
        try{const d=await firebase.firestore().collection('members').doc(u.uid).get();
          if(d.exists){const m=d.data();if(m.disabled===true){firebase.auth().signOut();toLogin('Tài khoản này đã bị khoá.');return}fbMemName=m.name||m.username||'';fbAvatar()}}
        catch(e){console.warn('member',e.code)}
      }
    });
    setInterval(()=>{if(fbUser&&sessExpired()){firebase.auth().signOut();toLogin('Phiên đăng nhập đã hết hạn (24 giờ). Vui lòng đăng nhập lại.')}},60000);
  }catch(e){console.warn('fb auth',e);hideLoad()}
}else hideLoad();



/* ===== Lịch sử bài làm ===== */
const HK=uid=>'wHist:'+uid,openH=new Set();
let HIST=[],started=false;
const fdate=t=>new Date(t).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const f2=n=>Math.round((+n||0)*100)/100;
const HC=()=>firebase.firestore().collection('users').doc(fbUser.uid).collection('writingHistory');
function readLocal(){try{return JSON.parse(localStorage.getItem(HK(fbUser.uid))||'[]')}catch(e){return[]}}
function saveLocal(){try{localStorage.setItem(HK(fbUser.uid),JSON.stringify(HIST.slice(0,150)))}catch(e){}}

function critHTML(crit,score,max){
  const f=n=>Math.round((+n||0)*100)/100;
  const fl=it=>`<div style="font-size:14px;margin-top:4px">${it.urteil===2?'✅':it.urteil===1?'🟡':'❌'} <b>${esc(it.punkt)}</b>${it.hinweis?' – '+esc(it.hinweis):''}</div>`;
  return `<div class="score-item" style="grid-column:1/-1;text-align:center"><div class="label">Tổng điểm</div><div class="val">${f(score)} <span class="max">/ ${f(max)}</span></div></div>`
    +(crit||[]).map(g=>`<div class="score-item"><div class="label">${esc(g.label)}</div><div class="val vs">${f(g.v)} <span class="max">/ ${f(g.max)}</span></div>${(g.rows||[]).map(r=>`<div style="font-size:14px;margin-top:8px"><b>${esc(r.label)}:</b> ${f(r.v)} – ${esc(r.txt)}</div>${(r.items||[]).map(fl).join('')}`).join('')}</div>`).join('')}
function bodyHTML(e){
  const tn=e.teilnoten||{};
  const P=i=>e.ptsArr&&e.ptsArr[i]?`${f2(e.ptsArr[i].v)} <span class="max">/ ${f2(e.ptsArr[i].max)}</span>`:'–';
  const crit=(l,i,t)=>`<div class="score-item"><div class="label">${l}</div><div class="val vs">${P(i)}</div>${t?`<div style="font-size:15px;margin-top:4px">${esc(t)}</div>`:''}</div>`;
  const kor=esc(e.korrektur||'').replace(/\*\*(.+?)\*\*/g,'<b style="color:var(--gr)">$1</b>');
  const must=(e.mustertexte&&e.mustertexte.length)?`<h4>📖 Bài mẫu tham khảo:</h4>`+e.mustertexte.map((m,i)=>`<div style="background:var(--g);border-radius:10px;padding:12px 16px;margin:8px 0;font-style:italic">${i+1}. ${esc(m)}</div>`).join(''):'';
  return `<div class="hmeta"><span class="pts">${esc(e.level||'A1')} · ${esc(e.type||'')} – ${esc(e.pts||'')}</span> &nbsp; ${+e.words||0} / ~${+e.req||0} từ</div>
    <div class="corrections"><b>📝 Bài làm của bạn:</b><br><br>${esc(e.text||'')}</div>
    <div class="score-grid">${e.crit&&e.crit.length?critHTML(e.crit,e.score,e.max):`
      <div class="score-item" style="grid-column:1/-1;text-align:center"><div class="label">Tổng điểm</div><div class="val">${f2(e.score)} <span class="max">/ ${f2(e.max)}</span></div></div>
      ${crit('Nội dung (Inhalt)',0,'')}${crit('Ngữ vực (Register)',1,tn.register)}${crit('Từ vựng (Wortschatz)',2,tn.wortschatz)}${crit('Cấu trúc (Strukturen)',3,tn.strukturen)}
      <div class="score-item" style="grid-column:1/-1"><div class="label">Lỗi (Fehler)</div><div style="font-size:15px;margin-top:6px">${esc(tn.fehler||'–')}</div></div>`}
    </div>
    ${e.korrektur?`<div class="corrections"><b>✏️ Bài đã sửa:</b><br><br>${kor}</div>`:''}
    <div class="feedback"><h4>💬 Nhận xét:</h4>${esc(e.kommentar||'')}${must}</div>
    <div class="row"><button class="sbtn" data-del="${esc(e.id)}">🗑️ Xoá bài này</button></div>`;
}
function entryHTML(e){
  return `<div class="acc hh${openH.has(e.id)?' open':''}" data-id="${esc(e.id)}"><div class="ah" role="button" tabindex="0"><span class="nm"><b>${esc(e.title)}</b><small>${esc(e.level||'A1')} · ${esc(e.type||'')} · ${fdate(e.at)}</small></span><span class="sc">${f2(e.score)} / ${f2(e.max)}</span><span class="ch">⌄</span></div><div class="abw"><div class="ab"><div class="hb">${bodyHTML(e)}</div></div></div></div>`;
}
function draw(){
  const L=HIST.filter(e=>(e.skill||'write')==='write'),box=$('hWrite');
  box.innerHTML=L.length?L.map(entryHTML).join('')+'<p style="margin-top:22px"><button class="sbtn" id="hClear">🗑️ Xoá toàn bộ lịch sử</button></p>'
    :'<div class="card" style="max-width:none">Chưa có bài làm nào. Hãy làm một đề ở <a href="writing.html" style="color:var(--yl)">Intensives Schreiben</a> – bài đã chấm xong sẽ được lưu ở đây.</div>';
}
async function onUser(){
  if(started)return;started=true;
  HIST=readLocal().sort((a,b)=>b.at-a.at);draw();
  try{
    const snap=await HC().orderBy('at','desc').limit(100).get();
    const m=new Map(HIST.map(e=>[e.id,e])),cloud=new Set();
    snap.docs.forEach(d=>{const e=d.data();cloud.add(e.id);m.set(e.id,e)});
    HIST=[...m.values()].sort((a,b)=>b.at-a.at);saveLocal();draw();
    HIST.filter(e=>!cloud.has(e.id)).slice(0,30).forEach(e=>HC().doc(e.id).set(e).catch(()=>{}));   /* đẩy bài còn ở máy lên cloud */
  }catch(e){console.warn('history cloud',e.code||e)}
}
async function delOne(id){
  const e=HIST.find(x=>x.id===id);if(!e||!confirm('Xoá bài làm “'+e.title+'” khỏi lịch sử?'))return;
  HIST=HIST.filter(x=>x.id!==id);openH.delete(id);saveLocal();draw();
  try{await HC().doc(id).delete()}catch(er){console.warn('del',er.code||er)}
}
async function clearAll(){
  if(!HIST.length||!confirm('Xoá toàn bộ lịch sử bài làm Schreiben? Không thể khôi phục.'))return;
  HIST=[];openH.clear();saveLocal();draw();
  try{for(;;){const snap=await HC().limit(400).get();if(snap.empty)break;const b=firebase.firestore().batch();snap.docs.forEach(d=>b.delete(d.ref));await b.commit()}}
  catch(er){console.warn('clear',er.code||er)}
  toast('Đã xoá lịch sử');
}
$('hWrite').onclick=e=>{
  const d=e.target.closest('[data-del]');if(d){delOne(d.dataset.del);return}
  if(e.target.closest('#hClear')){clearAll();return}
  const h=e.target.closest('.ah');if(h){const a=h.parentElement,on=a.classList.toggle('open');on?openH.add(a.dataset.id):openH.delete(a.dataset.id)}};
$('hWrite').onkeydown=e=>{if(e.key!=='Enter'&&e.key!==' ')return;const h=e.target.closest('.ah');if(!h)return;e.preventDefault();h.click()};
$('hTab').onclick=e=>{const b=e.target.closest('button[data-s]');if(!b)return;
  TopBar.pulse();
  $('hTab').querySelectorAll('button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b)});
  $('hWrite').classList.toggle('hide',b.dataset.s!=='write');$('hSpeak').classList.toggle('hide',b.dataset.s!=='speak')};

</script>
</body>
</html>
